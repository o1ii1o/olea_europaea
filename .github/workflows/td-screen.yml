name: TD Sequential Screen

on:
  schedule:
    # 22:30 UTC Mon-Fri — after the US cash close (20:00/21:00 UTC), so the
    # latest daily bar is settled. In Zurich this is 23:30 CET / 00:30 CEST.
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TD Sequential screen and update HTML
        run: python td_screen.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet index.html && echo "No changes" && exit 0
          git add index.html
          git commit -m "Update TD Sequential screen $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
